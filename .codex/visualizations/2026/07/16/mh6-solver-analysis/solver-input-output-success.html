    border: color('--border'),
    background: color('--background'),
    fail: color('--destructive'),
    input1: color('--viz-series-1'),

    animation: false,
    textStyle: {color: colors.foreground, fontFamily: 'inherit'},
    legend: [
      {top: 0, left: 62, textStyle: {color: colors.foreground}, data: ['palm_flexion', 'thumb_inward', 'palm_cross']},

      {left: 62, right: 18, top: 310, height: 200},
      {left: 62, right: 18, top: 568, height: 24}

    tooltip: {
      trigger: 'axis',
      axisPointer: {type: 'line'},
      formatter(params) {
        const index = params.length ? params[0].dataIndex : 0;
        const row = rows[Math.max(0, Math.min(rows.length - 1, index))];

        const motors = row[4]

          : '无候选解';
        return `<strong>${row[0].toFixed(3)} s · ${row[4] ? '成功' : '失败'}</strong><br>` +
          `flexion ${row[1].toFixed(4)} · thumb ${row[2].toFixed(4)} · cross ${row[3].toFixed(4)}<br>${motors}`;
      }
    },
    axisPointer: {link: [{xAxisIndex: 'all'}]},
    xAxis: [
      {...axisBase, type: 'value', gridIndex: 0, min: rows[0][0], max: rows[rows.length - 1][0], axisLabel: {show: false}, splitNumber: 10},

    series: [
      line('palm_flexion', 1, 0, 0, colors.input1),

  });
