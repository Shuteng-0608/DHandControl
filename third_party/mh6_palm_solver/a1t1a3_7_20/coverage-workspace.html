<div id="mh6-coverage-space">
  <div class="viz-controls">
    <label class="form-label" for="mh6-u3">
      <span>u3 / theta1: <strong id="mh6-u3-value">0.700 / -14.01°</strong></span>
      <input class="form-range" id="mh6-u3" type="range" min="0" max="1" value="0.7" step="0.0025">
    </label>
  </div>
  <div class="mh6-plot-wrap">
    <canvas id="mh6-coverage-canvas" role="img" aria-label="Fixed-theta1 slice of the MH6 feasible workspace. Horizontal axis is u1 and arpha2; vertical axis is u2 and arpha3. Filled cells are feasible rotational closures."></canvas>
    <div class="mh6-y-label text-small">u2 ↑<br>arpha3</div>
    <div class="mh6-x-label text-small">u1 / arpha2 →</div>
  </div>
  <div class="viz-row text-small" aria-label="Legend">
    <span class="mh6-legend"><span class="mh6-swatch mh6-valid"></span>可闭合</span>
    <span class="mh6-legend"><span class="mh6-swatch mh6-invalid"></span>不可闭合</span>
    <span>当前切片覆盖率：<strong id="mh6-slice-rate">—</strong></span>
  </div>
  <div id="mh6-point-detail" class="text-small text-muted" aria-live="polite">移动指针查看输入角度与闭合判据。</div>
</div>

<style>
  #mh6-coverage-space { width: 100%; color: var(--foreground); }
  #mh6-coverage-space .viz-controls { margin-bottom: 10px; }
  #mh6-coverage-space .form-label { width: min(100%, 420px); }
  #mh6-coverage-space .form-range { width: 100%; }
  #mh6-coverage-space .mh6-plot-wrap { position: relative; width: 100%; padding: 0 0 24px 34px; }
  #mh6-coverage-space canvas { display: block; width: 100%; height: 390px; border: 1px solid var(--border); }
  #mh6-coverage-space .mh6-x-label { position: absolute; left: 34px; right: 0; bottom: 0; text-align: center; color: var(--muted-foreground); }
  #mh6-coverage-space .mh6-y-label { position: absolute; left: 0; top: 45%; color: var(--muted-foreground); }
  #mh6-coverage-space .viz-row { justify-content: flex-start; gap: 14px; margin-top: 8px; }
  #mh6-coverage-space .mh6-legend { display: inline-flex; align-items: center; gap: 6px; }
  #mh6-coverage-space .mh6-swatch { width: 12px; height: 12px; display: inline-block; }
  #mh6-coverage-space .mh6-valid { background: color-mix(in srgb, var(--viz-series-1) 82%, transparent); }
  #mh6-coverage-space .mh6-invalid { background: color-mix(in srgb, var(--muted) 72%, transparent); }
  #mh6-coverage-space #mh6-point-detail { min-height: 1.5em; margin-top: 6px; }
  @media (max-width: 520px) {
    #mh6-coverage-space canvas { height: 300px; }
  }
</style>

<script>
(() => {
  const root = document.getElementById('mh6-coverage-space');
  const slider = root.querySelector('#mh6-u3');
  const valueLabel = root.querySelector('#mh6-u3-value');
  const rateLabel = root.querySelector('#mh6-slice-rate');
  const detail = root.querySelector('#mh6-point-detail');
  const canvas = root.querySelector('#mh6-coverage-canvas');
  const ctx = canvas.getContext('2d');
  const n = 161;
  let currentU3 = Number(slider.value);

  const rad = d => d * Math.PI / 180;
  const s80 = Math.sin(rad(80));
  const c80 = Math.cos(rad(80));
  const s35 = Math.sin(rad(35));
  const c35 = Math.cos(rad(35));
  const s20 = Math.sin(rad(20));
  const c20 = Math.cos(rad(20));
  const s225 = Math.sin(rad(225));
  const c225 = Math.cos(rad(225));

  function closureValue(u1, u2, u3) {
    const a2 = rad(121.9 * u1 - 31.1);
    const a3 = rad(-239 * u2 + 59);
    const t1 = rad(-32.3 * u3 + 8.6);
    const ca2 = Math.cos(a2), sa2 = Math.sin(a2);
    const ct1 = Math.cos(t1), st1 = Math.sin(t1);
    const czz = s80 * s80 * (c80 * (ct1 * (1 - ca2) + ca2) + sa2 * st1) + c80 * c80 * c80;
    const ca3 = Math.cos(a3), sa3 = Math.sin(a3);
    const vx = c20 * s225 * ca3 + s20 * c225;
    const vy = s225 * sa3;
    const vz = -s20 * s225 * ca3 + c20 * c225;
    const rv = Math.hypot(vx, vy);
    return (c35 * vz - czz) / (s35 * rv);
  }

  function themeColor(name, fallback) {
    const value = getComputedStyle(root).getPropertyValue(name).trim();
    return value || fallback;
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    const width = Math.max(320, Math.round(rect.width * dpr));
    const height = Math.max(240, Math.round(rect.height * dpr));
    if (canvas.width !== width || canvas.height !== height) {
      canvas.width = width;
      canvas.height = height;
    }
  }

  function draw() {
    resizeCanvas();
    currentU3 = Number(slider.value);
    const theta1 = -32.3 * currentU3 + 8.6;
    valueLabel.textContent = `${currentU3.toFixed(3)} / ${theta1.toFixed(2)}°`;
    const validColor = themeColor('--viz-series-1', 'rgb(70, 120, 220)');
    const invalidColor = themeColor('--muted', 'rgb(150, 150, 150)');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = invalidColor;
    ctx.globalAlpha = 0.42;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = validColor;
    ctx.globalAlpha = 0.82;
    const cellW = canvas.width / n;
    const cellH = canvas.height / n;
    let valid = 0;
    for (let iy = 0; iy < n; iy++) {
      const u2 = iy / (n - 1);
      for (let ix = 0; ix < n; ix++) {
        const u1 = ix / (n - 1);
        if (Math.abs(closureValue(u1, u2, currentU3)) <= 1) {
          valid++;
          ctx.fillRect(ix * cellW, iy * cellH, Math.ceil(cellW + 0.5), Math.ceil(cellH + 0.5));
        }
      }
    }
    ctx.globalAlpha = 1;
    rateLabel.textContent = `${(100 * valid / (n * n)).toFixed(1)}%`;
  }

  function showPoint(event) {
    const rect = canvas.getBoundingClientRect();
    const u1 = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
    const u2 = Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height));
    const a2 = 121.9 * u1 - 31.1;
    const a3 = -239 * u2 + 59;
    const t1 = -32.3 * currentU3 + 8.6;
    const value = closureValue(u1, u2, currentU3);
    const feasible = Math.abs(value) <= 1;
    detail.textContent = `${feasible ? '可闭合' : '不可闭合'} · arpha2=${a2.toFixed(1)}° · arpha3=${a3.toFixed(1)}° · theta1=${t1.toFixed(1)}° · 判据=${value.toFixed(3)}`;
  }

  slider.addEventListener('input', draw);
  canvas.addEventListener('pointermove', showPoint);
  canvas.addEventListener('pointerleave', () => { detail.textContent = '移动指针查看输入角度与闭合判据。'; });
  new ResizeObserver(draw).observe(canvas);
  draw();
})();
</script>
